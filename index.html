    :root {
      --profileBackground: #10215c;
      --button-style-text: #f7f7f6;

      --profile-container-desktop-width: 580px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--profileBackground);
      color: var(--button-style-text);
      font-family: 'Manrope', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.24);
      color: #fff;
    }

    :focus-visible {

      outline-offset: 3px;
    }

    @media (min-width: 640px) {
      body {
        background-color: #0b1740;
      }

    /* ========================================================
       BOTONES GLASSMORPHISM EXACTOS DE LINKTREE
       ======================================================== */
    .link-button-glass {
      position: relative;
      width: 100%;
      min-height: 64px;
      border-radius: 9999px;
      overflow: hidden;
      background: var(--button-style-background);
      -webkit-backdrop-filter: blur(20px) brightness(1.1) contrast(0.9);
      backdrop-filter: blur(20px) brightness(1.1) contrast(0.9);
      box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.02);
      transition: transform 75ms ease,
                  box-shadow 75ms ease,
                  background-color 75ms ease,
                  backdrop-filter 75ms ease,
                  -webkit-backdrop-filter 75ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    /* Borde luminoso refinado de cristal (XOR mask) */
    .link-button-glass::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 9999px;
      padding: 1px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.3));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      pointer-events: none;
    }

    /* Ruido fractal granulado Linktree */
    .link-button-glass::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 9999px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.15;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .link-button-glass:hover {
      -webkit-backdrop-filter: blur(20px) brightness(1.2) contrast(0.9);
      backdrop-filter: blur(20px) brightness(1.2) contrast(0.9);
      transform: scale(1.015);
    }

    .link-button-glass:active {
      transform: scale(0.975);
    }

    /* Chips de iconos: vidrio circular moderno */
    .topbar-badge {
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(16, 33, 92, 0.55) 0%, rgba(16, 33, 92, 0.32) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.16) inset, 0 8px 24px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), background 220ms ease;
    }
    .topbar-badge:hover {
      background: linear-gradient(180deg, rgba(16, 33, 92, 0.7) 0%, rgba(16, 33, 92, 0.45) 100%);
      transform: translateY(-1px);
    }
    .topbar-badge:active {
      transform: scale(0.94);
    }

    .icon-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset, 0 6px 18px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1), background 200ms ease, border-color 200ms ease;
    }
    .icon-chip:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.24);
    }
    .icon-chip:active {
      transform: scale(0.94);
    }
    .icon-chip svg {
      transition: transform 200ms ease;
    }
    .icon-chip:hover svg {
      transform: scale(1.06);
    }

    /* Barra superior: en desktop baja con el scroll y luego se pega arriba */
    .topbar {
      transition: transform 300ms ease-out, opacity 300ms ease-out;
    }
    @media (min-width: 640px) {
      /* Especificidad sobre utilidades de Tailwind (fixed/top-0) */
      #topbar {
        position: absolute;
        top: 54px;
      }
      #topbar.is-stuck {
        position: fixed;
        top: 12px;
      }
    }

    .share-badge {
      background: #25d366;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
      border: 0;
    }

    @keyframes rotateLogo {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(1turn); }
    }
    .animate-spin-3d {
      animation: rotateLogo 2.5s cubic-bezier(0.54, -0.34, 0.33, 1.14) 1s;
    }

    /* Animación Parallax de Scroll en el Hero */
    @keyframes headerScrollFade {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(100px) scale(1.01); }
    }
    @keyframes headerScrollFadeInner {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-50px) scale(1.1); }
    }

    .scroll-fade-outer {
      animation: headerScrollFade ease-out forwards;
      animation-timeline: scroll(root);
      animation-range: 40px min(50vh, 580px);
    }
    .scroll-fade-inner {
      animation: headerScrollFadeInner ease-out forwards;
      animation-timeline: scroll(root);
      animation-range: 40px calc(580px * 1.5);
    }

  <!-- Script para asegurar el efecto Parallax al hacer scroll en todos los navegadores -->
  <script>
    // Barra superior: en desktop se desplaza con la página y se pega arriba
    // al pasar el offset inicial (54px), igual que Linktree.
    const topbar = document.getElementById('topbar');
    const desktopQuery = window.matchMedia('(min-width: 640px)');
    const TOPBAR_OFFSET = 54;

    function updateTopbar() {
      const isStuck = desktopQuery.matches && window.scrollY >= TOPBAR_OFFSET;
      topbar.classList.toggle('is-stuck', isStuck);
    }

    if (topbar) {
      window.addEventListener('scroll', updateTopbar, { passive: true });
      desktopQuery.addEventListener('change', updateTopbar);
      updateTopbar();
    }

    const profilePic = document.getElementById('profile-picture');
    if (profilePic && !CSS.supports('animation-timeline', 'scroll()')) {
      const sharpLayer = profilePic.querySelector('.hero-mask-sharp');
      const blurLayer = profilePic.querySelector('.hero-mask-blur');
      
      window.addEventListener('scroll', () => {
        const y = window.scrollY || window.pageYOffset || 0;
        const progress = Math.min(Math.max(y / 400, 0), 1);
        
        if (sharpLayer) {
          sharpLayer.style.opacity = (1 - progress * 1.15).toFixed(3);
          sharpLayer.style.transform = `translateY(${y * 0.22}px) scale(${1 + progress * 0.02})`;
        }
        if (blurLayer) {
          blurLayer.style.transform = `translateY(${-y * 0.12}px) scale(${1 + progress * 0.08})`;
        }
      }, { passive: true });
    }

    // ========================================================
    // FUNCIONES DEL BOTÓN COMPARTIR Y TOAST
    // ========================================================
    let toastTimer;
    function showToast(msg = "¡Enlace copiado al portapapeles!") {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-8', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-8', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    function shareProfile() {
      const shareData = {
        title: 'PASTA Restaurant',
        text: 'Mira el menú y contacto de PASTA',
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          showToast('¡Enlace copiado al portapapeles!');
        }).catch(() => {
          fallbackCopy(window.location.href);
        });
      } else {
        fallbackCopy(window.location.href);
      }
    }

    function fallbackCopy(text) {
      const input = document.createElement('textarea');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('¡Enlace copiado al portapapeles!');
    }
  </script>
